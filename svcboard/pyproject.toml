[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svcboard"
version = "0.1.0"
description = "Scan local listening ports and their owning processes, export as Markdown/JSON. Local-first, cross-platform."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ports", "services", "psutil", "cli", "devops", "local-first"]
authors = [{ name = "山川志", email = "3671276527@qq.com" }]
dependencies = ["psutil>=5.9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/DorianChn/svcboard"
Repository = "https://github.com/DorianChn/svcboard"

[project.scripts]
svcboard = "svcboard.cli:main"

[tool.setuptools.packages.find]
include = ["svcboard*"]
