name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e .[dev]
      - name: Test
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build --sdist --wheel --outdir dist
      - name: Install from wheel
        run: |
          pip install dist/*.whl
      - name: CLI smoke test
        run: |
          capsule --version
          capsule --help
          capsule config list
      - name: Demo script syntax check
        run: bash -n examples/demo.sh
