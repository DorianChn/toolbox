name: chat-with-anything

on:
  push:
    paths:
      - "chat-with-anything/**"
      - ".github/workflows/chat-with-anything.yml"
  pull_request:
    paths:
      - "chat-with-anything/**"
      - ".github/workflows/chat-with-anything.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: chat-with-anything
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: chat-with-anything/pyproject.toml
      - run: python -m pip install --upgrade pip
      # The full LlamaIndex/Chroma stack is not needed for deterministic checks.
      - run: python -m pip install --no-deps --editable .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: >-
          python -c "from importlib.metadata import distribution;
          eps = distribution('chat-with-anything').entry_points;
          ep = [e for e in eps if e.group == 'console_scripts' and e.name == 'cwa'];
          assert ep and ep[0].value == 'cwa.cli:main'"
