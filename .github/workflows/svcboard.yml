name: svcboard

on:
  push:
    paths:
      - "svcboard/**"
      - ".github/workflows/svcboard.yml"
  pull_request:
    paths:
      - "svcboard/**"
      - ".github/workflows/svcboard.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: svcboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: svcboard/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable .
      - run: python -m unittest discover -s tests -v
