name: python-scaffold

on:
  push:
    paths:
      - "python-scaffold/**"
      - ".github/workflows/python-scaffold.yml"
  pull_request:
    paths:
      - "python-scaffold/**"
      - ".github/workflows/python-scaffold.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python-scaffold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile main.py
      - run: python main.py
