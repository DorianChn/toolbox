name: CI

on:
  push:
    branches: [main]
    paths: ["devkit-cli/**"]
  pull_request:
    paths: ["devkit-cli/**"]
  workflow_dispatch: {}

jobs:
  devkit-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run devkit-cli tests (zero-dependency, no install)
        working-directory: devkit-cli
        run: npm test
